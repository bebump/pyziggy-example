<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Temperatures</title>
    <script src="https://cdn.rawgit.com/Mikhus/canvas-gauges/master/gauge.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .room-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .room-card:hover {
            transform: translateY(-5px);
        }

        .room-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            text-transform: capitalize;
        }

        .info-container {
            width: 100%;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .heating-status {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .heating-on {
            background-color: #ffebee;
            color: #d32f2f;
        }

        .heating-off {
            background-color: #e8f5e9;
            color: #388e3c;
        }

        .last-update {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="rooms-container" style="display: contents;"></div>
    <div class="last-update" id="last-update">Last update: Never</div>

    <script>
        const gauges = {};

        function createGauge(id, container, name) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);

            return new RadialGauge({
                renderTo: canvas,
                width: 200,
                height: 200,
                units: "°C",
                title: name,
                minValue: 20,
                maxValue: 28,
                majorTicks: [
                    "20", "21", "22", "23", "24", "25", "26", "27", "28"
                ],
                minorTicks: 2,
                strokeTicks: true,
                highlights: [
                    { "from": 20, "to": 22, "color": "rgba(0,0,255,.3)" },
                    { "from": 26, "to": 28, "color": "rgba(255,0,0,.3)" }
                ],
                ticksAngle: 225,
                startAngle: 67.5,
                colorMajorTicks: "#444",
                colorMinorTicks: "#666",
                colorTitle: "#333",
                colorUnits: "#333",
                colorNumbers: "#222",
                colorPlate: "#fff",
                borderShadowWidth: 0,
                borders: false,
                needleType: "arrow",
                needleWidth: 2,
                needleCircleSize: 7,
                needleCircleOuter: true,
                needleCircleInner: false,
                animationDuration: 1500,
                animationRule: "linear",
                colorNeedle: "#222",
                colorNeedleEnd: "#222",
                valueBox: true,
                valueInt: 1,
                valueDec: 1,
                colorValueText: "#000",
                fontValueSize: 45
            }).draw();
        }

        function updateRooms() {
            fetch('/pyziggy/api/room_infos')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('rooms-container');

                    for (const [roomKey, info] of Object.entries(data)) {
                        let card = document.getElementById(`card-${roomKey}`);
                        if (!card) {
                            card = document.createElement('div');
                            card.id = `card-${roomKey}`;
                            card.className = 'room-card';

                            const nameEl = document.createElement('div');
                            nameEl.className = 'room-name';
                            nameEl.innerText = roomKey.replace('_', ' ');
                            card.appendChild(nameEl);

                            const gaugeContainer = document.createElement('div');
                            card.appendChild(gaugeContainer);
                            gauges[roomKey] = createGauge(roomKey, gaugeContainer, "");

                            const infoContainer = document.createElement('div');
                            infoContainer.id = `info-${roomKey}`;
                            infoContainer.className = 'info-container';
                            card.appendChild(infoContainer);

                            container.appendChild(card);
                        }

                        // Update Gauge
                        gauges[roomKey].value = info.current_temperature;

                        // Update Highlights to show target range
                        const target = info.target_temperature;
                        const dev = info.max_allowed_deviation_from_target;
                        const highlights = [
                            { "from": 20, "to": 22, "color": "rgba(0,0,255,.3)" },
                            { "from": 26, "to": 28, "color": "rgba(255,0,0,.3)" }
                        ];

                        if (target > 0) {
                            highlights.push({ "from": target - dev, "to": target + dev, "color": "rgba(0,255,0,.5)" });
                        }

                        gauges[roomKey].update({ highlights: highlights });
                        const infoEl = document.getElementById(`info-${roomKey}`);
                        infoEl.innerHTML = `
                            <div class="info-row">
                                <span>Target:</span>
                                <span>${info.target_temperature.toFixed(1)}°C</span>
                            </div>
                            <div class="info-row">
                                <span>Status:</span>
                                <span class="heating-status ${info.heating_on ? 'heating-on' : 'heating-off'}">
                                    ${info.heating_on ? 'HEATING' : 'IDLE'}
                                </span>
                            </div>
                        `;
                    }
                    document.getElementById('last-update').innerText = `Last update: ${new Date().toLocaleTimeString()}`;
                })
                .catch(error => console.error('Error fetching room infos:', error));
        }

        // Initial fetch
        updateRooms();

        // Update every 10 seconds
        setInterval(updateRooms, 10000);
    </script>
</body>
</html>
