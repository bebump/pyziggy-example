<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Temperatures</title>
    <script src="https://cdn.rawgit.com/Mikhus/canvas-gauges/master/gauge.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.3.1/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #rooms-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .room-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .room-card:hover {
            transform: translateY(-5px);
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            width: 95%;
            max-width: 1200px;
            height: 500px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
        }

        .chart-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #f0f0f0;
        }

        .control-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .range-info {
            font-size: 0.9rem;
            color: #666;
            margin: 0 10px;
            font-weight: bold;
        }

        .room-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            text-transform: capitalize;
        }

        .info-container {
            width: 100%;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .heating-status {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .heating-on {
            background-color: #ffebee;
            color: #d32f2f;
        }

        .heating-off {
            background-color: #e8f5e9;
            color: #388e3c;
        }

        .last-update {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="rooms-container"></div>
    
    <div class="chart-card">
        <div class="chart-controls">
            <button class="control-btn" onclick="panTime(-1)">◀ Prev</button>
            <div id="range-buttons">
                <button class="control-btn" onclick="setRange(1)">24h</button>
                <button class="control-btn" onclick="setRange(3)">3d</button>
                <button class="control-btn" onclick="setRange(7)">7d</button>
                <button class="control-btn" onclick="setRange(10)" id="default-range-btn">10d</button>
                <button class="control-btn" onclick="setRange(30)">30d</button>
                <button class="control-btn" onclick="setRange(0)">All</button>
            </div>
            <button class="control-btn" onclick="panTime(1)">Next ▶</button>
            <button class="control-btn" onclick="resetToNow()">Now</button>
            <div class="range-info" id="range-info"></div>
        </div>
        <canvas id="temperature-chart"></canvas>
    </div>

    <div class="last-update" id="last-update">Last update: Never</div>

    <script>
        const gauges = {};
        let temperatureChart = null;
        let viewEndDate = new Date();
        let viewRangeDays = 10;

        const roomColors = {
            'office': 'rgba(255, 99, 132, 1)',
            'living_room': 'rgba(54, 162, 235, 1)',
            'kitchen': 'rgba(255, 206, 86, 1)',
            'bedroom': 'rgba(75, 192, 192, 1)',
            'bathroom': 'rgba(153, 102, 255, 1)'
        };

        function initChart() {
            const ctx = document.getElementById('temperature-chart').getContext('2d');
            temperatureChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: []
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    hour: 'HH:mm',
                                    day: 'MMM d'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: false
                        }
                    },
                    elements: {
                        point: {
                            radius: 0 // Hide points for better performance
                        },
                        line: {
                            borderWidth: 2,
                            tension: 0.3
                        }
                    }
                }
            });
        }

        function setRange(days) {
            viewRangeDays = days;
            
            // Update active state of buttons
            document.querySelectorAll('#range-buttons .control-btn').forEach(btn => {
                const btnDays = parseInt(btn.getAttribute('onclick').match(/\d+/)[0]);
                if (btnDays === days) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            updateChart();
        }

        function panTime(direction) {
            if (viewRangeDays === 0) return; // Can't pan if showing everything

            const panAmount = viewRangeDays * 0.5; // Pan by half the current range
            const newEndDate = new Date(viewEndDate.getTime() + direction * panAmount * 24 * 60 * 60 * 1000);
            
            // Don't pan into the future beyond a small buffer
            if (newEndDate > new Date(new Date().getTime() + 3600000)) {
                viewEndDate = new Date();
            } else {
                viewEndDate = newEndDate;
            }

            updateChart();
        }

        function resetToNow() {
            viewEndDate = new Date();
            updateChart();
        }

        function updateChart() {
            let url = '/pyziggy/api/temperature_data';
            const params = new URLSearchParams();

            if (viewRangeDays > 0) {
                const startDate = new Date(viewEndDate.getTime() - viewRangeDays * 24 * 60 * 60 * 1000);
                params.append('start', startDate.toISOString());
                params.append('end', viewEndDate.toISOString());
                
                // Update unit based on range
                if (viewRangeDays <= 2) {
                    temperatureChart.options.scales.x.time.unit = 'hour';
                } else {
                    temperatureChart.options.scales.x.time.unit = 'day';
                }

                document.getElementById('range-info').innerText = 
                    `${startDate.toLocaleDateString()} - ${viewEndDate.toLocaleDateString()}`;
            } else {
                document.getElementById('range-info').innerText = 'All recorded data';
                temperatureChart.options.scales.x.time.unit = 'day';
            }

            const queryString = params.toString();
            if (queryString) {
                url += '?' + queryString;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const datasets = [];
                    for (const [roomKey, points] of Object.entries(data)) {
                        datasets.push({
                            label: roomKey.replace('_', ' '),
                            data: points.map(p => ({ x: new Date(p[0]), y: p[1] })),
                            borderColor: roomColors[roomKey] || `hsl(${Math.random() * 360}, 70%, 50%)`,
                            backgroundColor: 'transparent',
                        });
                    }
                    temperatureChart.data.datasets = datasets;
                    temperatureChart.update();
                })
                .catch(error => console.error('Error fetching temperature data:', error));
        }

        function createGauge(id, container, name) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);

            return new RadialGauge({
                renderTo: canvas,
                width: 200,
                height: 200,
                units: "°C",
                title: name,
                minValue: 20,
                maxValue: 28,
                majorTicks: [
                    "20", "21", "22", "23", "24", "25", "26", "27", "28"
                ],
                minorTicks: 2,
                strokeTicks: true,
                highlights: [
                    { "from": 20, "to": 22, "color": "rgba(0,0,255,.3)" },
                    { "from": 26, "to": 28, "color": "rgba(255,0,0,.3)" }
                ],
                ticksAngle: 225,
                startAngle: 67.5,
                colorMajorTicks: "#444",
                colorMinorTicks: "#666",
                colorTitle: "#333",
                colorUnits: "#333",
                colorNumbers: "#222",
                colorPlate: "#fff",
                borderShadowWidth: 0,
                borders: false,
                needleType: "arrow",
                needleWidth: 2,
                needleCircleSize: 7,
                needleCircleOuter: true,
                needleCircleInner: false,
                animationDuration: 1500,
                animationRule: "linear",
                colorNeedle: "#222",
                colorNeedleEnd: "#222",
                valueBox: true,
                valueInt: 1,
                valueDec: 1,
                colorValueText: "#000",
                fontValueSize: 45
            }).draw();
        }

        function updateRooms() {
            fetch('/pyziggy/api/room_infos')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('rooms-container');

                    for (const [roomKey, info] of Object.entries(data)) {
                        let card = document.getElementById(`card-${roomKey}`);
                        if (!card) {
                            card = document.createElement('div');
                            card.id = `card-${roomKey}`;
                            card.className = 'room-card';

                            const nameEl = document.createElement('div');
                            nameEl.className = 'room-name';
                            nameEl.innerText = roomKey.replace('_', ' ');
                            card.appendChild(nameEl);

                            const gaugeContainer = document.createElement('div');
                            card.appendChild(gaugeContainer);
                            gauges[roomKey] = createGauge(roomKey, gaugeContainer, "");

                            const infoContainer = document.createElement('div');
                            infoContainer.id = `info-${roomKey}`;
                            infoContainer.className = 'info-container';
                            card.appendChild(infoContainer);

                            container.appendChild(card);
                        }

                        // Update Gauge
                        gauges[roomKey].value = info.current_temperature;

                        // Update Highlights to show target range
                        const target = info.target_temperature;
                        const dev = info.max_allowed_deviation_from_target;
                        const highlights = [
                            { "from": 20, "to": 22, "color": "rgba(0,0,255,.3)" },
                            { "from": 26, "to": 28, "color": "rgba(255,0,0,.3)" }
                        ];

                        if (target > 0) {
                            highlights.push({ "from": target - dev, "to": target + dev, "color": "rgba(0,255,0,.5)" });
                        }

                        gauges[roomKey].update({ highlights: highlights });
                        const infoEl = document.getElementById(`info-${roomKey}`);
                        infoEl.innerHTML = `
                            <div class="info-row">
                                <span>Target:</span>
                                <span>${info.target_temperature.toFixed(1)}°C</span>
                            </div>
                            <div class="info-row">
                                <span>Status:</span>
                                <span class="heating-status ${info.heating_on ? 'heating-on' : 'heating-off'}">
                                    ${info.heating_on ? 'HEATING' : 'IDLE'}
                                </span>
                            </div>
                        `;
                    }
                    document.getElementById('last-update').innerText = `Last update: ${new Date().toLocaleTimeString()}`;
                })
                .catch(error => console.error('Error fetching room infos:', error));
        }

        // Initial fetch
        updateRooms();
        initChart();
        setRange(10);

        // Update rooms every 10 seconds
        setInterval(updateRooms, 10000);
        
        // Update chart every 5 minutes
        setInterval(updateChart, 300000);
    </script>
</body>
</html>
